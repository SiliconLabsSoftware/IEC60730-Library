# Host SDK map for sample project generation.
#
# One IEC60730 .slce / .slcp tree is committed (designed-for gecko_sdk 4.5.0).
# This file only selects which installed SDK `slc generate --sdk` uses.
# It does not create per-SDK copies of the extension manifests.
#
# Columns, pipe-separated:
#   key | slc_sdk_id | sdk_version | slt_package | env_override | fallback_dir
#
# Keys (aliases are accepted by script/generate_demo.sh):
#   gsdk450    Gecko SDK 4.5.0          (also: gecko, 4.5.0)
#   ssdk20266  Simplicity SDK 2026.6.0  (also: simplicity, 2026.6.0)
#
# Override the resolved tree with GSDK_PATH or SSDK_PATH (see env_override).

gsdk450|gecko_sdk|4.5.0|gecko-sdk|GSDK_PATH|${HOME}/SimplicityStudio/SDKs/gecko_sdk
ssdk20266|simplicity_sdk|2026.6.0|simplicity-sdk|SSDK_PATH|
