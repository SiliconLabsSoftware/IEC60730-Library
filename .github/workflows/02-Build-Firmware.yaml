name: 02-Build-Firmware

on:
  pull_request:
    branches:
      - main
      - master
      - "release/**"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branches to run the workflow on'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  FW_build:
    name: FW_build (${{ matrix.board }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        board:
          - brd4121a
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Build Docker Image
        run: |
          IMAGE="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-build-env:latest"
          docker build -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build firmware in Docker
        run: |
          mkdir -p "${HOME}/.cache/iec60730"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${HOME}/.cache/iec60730:/root/.cache/iec60730" \
            -e IEC60730_CACHE_DIR=/root/.cache/iec60730 \
            -w /workspace \
            "$IMAGE" /bin/bash -c \
            "make RUNNER=native bootstrap && make RUNNER=native BOARD_NAME=${{ matrix.board }} build-unit && make RUNNER=native BOARD_NAME=${{ matrix.board }} build-integration"

      - name: Clean up workspace
        if: always()
        run: sudo git clean -ffdx
